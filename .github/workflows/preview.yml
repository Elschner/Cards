name: Preview
# Builds the app with demo data and screenshots the main pages (artifact: screenshots).
on:
  workflow_dispatch:
  push:
    branches: [preview]
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./demo.db"
      APP_PASSWORD: "preview"
      SCRYFALL_USER_AGENT: "CardOps-CI/0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npx prisma db push
      - run: node --experimental-strip-types scripts/seed-demo.ts
      - run: npm run build
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Start app and take screenshots
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null -u admin:preview http://localhost:3000 && break; sleep 1; done
          node scripts/screenshots.mjs
          echo "--- server log"; tail -50 server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
